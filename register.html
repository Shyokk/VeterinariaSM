<!-- EN ESTE HTML LOS USUARIOS PODRÁN REGISTRARSE COMO TUTOR O VETERINARIO -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Cuenta - Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <body>

        <!-- HEADER DINÁMICO -->
        <div id="header-contenedor"></div>

        <main class="contenido-main">
            <section class="seccion-formulario-registro">
                <div class="formulario-registro">
                    
                    <h1>Registro de Usuario</h1>
                    <p>Cree su cuenta para acceder a la plataforma de la Veterinaria San Marcos.</p>

                    <form id="form-registro-tutor" action="#" method="POST">

                        <!-- DATOS PERSONALES -->
                        <fieldset>
                            <legend>Información Personal</legend>

                            <div class="campo-formulario">
                                <label for="rut">RUT / Identificación:</label>
                                <input 
                                    type="text" 
                                    id="rut" 
                                    name="rut" 
                                    placeholder="Ej: 12.345.678-K" 
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="nombres">Nombres:</label>
                                <input 
                                    type="text" 
                                    id="nombres" 
                                    name="nombres" 
                                    placeholder="Ej: Roberto Carlos" 
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="apellidos">Apellidos:</label>
                                <input 
                                    type="text" 
                                    id="apellidos" 
                                    name="apellidos" 
                                    placeholder="Ej: Gómez Bolaños" 
                                    required
                                >
                            </div>
                        </fieldset>

                        <!-- SELECCIÓN DE ROL Y VERIFICACIÓN -->
                        <fieldset>
                            <legend>Tipo de Cuenta y Seguridad</legend>

                            <div class="campo-formulario">
                                <label for="tipo-usuario">Tipo de Cuenta:</label>
                                <select id="tipo-usuario" name="tipo_usuario" required>
                                    <option value="">-- Seleccione un tipo de cuenta --</option>
                                    <option value="tutor">Tutor / Dueño de Mascota</option>
                                    <option value="veterinario">Veterinario / Personal Clínico</option>
                                </select>
                            </div>

                            <!-- Se activa mediante JS si seleccionan 'veterinario' -->
                            <div class="campo-formulario" id="campo-clave-clinica" style="display: none;">
                                <label for="clave-institucional">Clave de Activación Clínica:</label>
                                <input 
                                    type="password" 
                                    id="clave-institucional" 
                                    name="clave_institucional" 
                                    placeholder="Ingrese la clave entregada por la clínica"
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="correo">Correo electrónico:</label>
                                <input 
                                    type="email" 
                                    id="correo" 
                                    name="correo" 
                                    placeholder="Ej: usuario@correo.cl" 
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="telefono">Teléfono de contacto:</label>
                                <input 
                                    type="tel" 
                                    id="telefono" 
                                    name="telefono" 
                                    placeholder="Ej: +56912345678" 
                                    required
                                >
                            </div>

                            <div class="campo-formulario">
                                <label for="contrasena">Contraseña:</label>
                                <input 
                                    type="password" 
                                    id="contrasena" 
                                    name="contrasena" 
                                    placeholder="Cree una contraseña segura" 
                                    required
                                >
                            </div>

                            <div class="campo-formulario campo-checkbox">
                                <input type="checkbox" id="terminos" name="terminos" required>
                                <label for="terminos">Acepto los términos y condiciones de uso</label>
                            </div>
                        </fieldset>

                        <!-- BOTONES DE ACCIÓN -->
                        <div class="acciones-formulario">
                            <button type="submit" class="boton">
                                Registrar Cuenta
                            </button>
                            <a href="login.html" class="boton boton-secundario">
                                ¿Ya tienes cuenta? Iniciar Sesión
                            </a>
                        </div>

                    </form>

                </div>
            </section>
        </main>

        <!-- FOOTER DINÁMICO -->
        <div id="footer-contenedor"></div>

        <!-- SCRIPTS -->
        <script src="assets/js/app.js"></script>
        <script src="assets/js/validaciones/validarRegistro.js"></script>
    </body>
</html>
