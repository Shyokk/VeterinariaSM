<!-- EN ESTE HTML LOGIN SERA PARA USUARIOS DONDE SE PODRÁN REGISTRAR -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">

            <section class="seccion-register">

                <div>

                    <h1>Registro de Tutor</h1>
                    
                    <form class="formulario-register" method="get">
                        
                        <div>

                            <label for="nombres">Nombres</label>
                            <input type="text" id="nombres" name="nombres" required>

                        </div>

                        <div>

                            <label for="apellidos">Apellidos</label>
                            <input type="text" id="apellidos" name="apellidos" required>

                        </div>

                        <div>

                            <label for="rut">RUT</label>
                            <input type="text" id="rut" name="rut" placeholder="12.345.678-K" required>

                        </div>

                        <div>

                            <label for="correo">Correo Electrónico</label>
                            <input type="email" id="correo" name="correo" required>

                        </div>

                        <div>

                            <label for="telefono">Número de Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="+56912345678" required>

                        </div>

                        <div>

                            <label for="contrasena">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena" required>

                        </div>
                        
                        <div>
                            
                            <input type="checkbox" id="terminos" name="terminos" required>
                            <label for="terminos">Acepto los términos de uso</label>
                        
                        </div>
                        
                        <button type="submit">Registrar Cuenta</button>

                        <a href="login.html">

                            <button type="button" class="btnInicioSesion">Iniciar Sesión</button>

                        </a>
                    
                    </form>

                </div>

            </section>
            

            
        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
