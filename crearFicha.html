<!-- EN ESTE HTML CREARFICHA SERÁ PARA LA VISTA DE DOCTOR PARA CREAR FICHAS NUEVAS DE PACIENTE -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">
            
            <!-- ESTE ES EL COMIENZO DEL BLOQUE PARA CREAR UNA FICHA DE PACIENTE NUEVA -->
            <section class="seccion-ficha">
                
                <div>

                    <h1>Crear Nueva Ficha de Paciente</h1>

                    <form class="formulario-ficha">

                        <div class="datosTutor">

                            <div>

                                <label for="rut">RUT del tutor</label>
                                <input type="text" id="rut" name="rut" placeholder="12.345.678-K" required>

                            </div>

                            <div>

                                <label for="nombreTutor">Nombre del Tutor</label>
                                <input type="text" id="nombreTutor" name="nombreTutor" required>

                            </div>

                        </div>

                        <div>

                            <label for="nombreMascota">Nombre del Paciente</label>
                            <input type="text" id="nombreMascota" name="nombreMascota" required>

                        </div>

                        <div>

                            <div>

                                <label for="rutMascota">RUT de la mascota:</label>
                                <input type="text" id="rutMascota" maxlength="9" name="rutMascota" placeholder="129634321" disabled>

                            </div>

                            <div>
                                <input type="checkbox" id="aceptaRut" name="aceptaRut">
                                <label>Paciente cuenta con RUT</label>
                            </div>

                            <div>

                                <label for="codUnico">Código únido para Paciente</label>
                                <input type="text" name="codUnico" id="codUnico" maxlength="9" readonly>

                            </div>

                        </div>


                        <div>

                            <label for="nacimientoMascota">Fecha de nacimiento</label>
                            <input type="date" id="nacimientoMascota" name="nacimientoMascota" required>
                            
                        </div>

                        <div>

                            <label for="edadMascota">Edad</label>
                            <input type="number" id="edadMascota" name="edadMascota" min="0" required>

                        </div>

                        <div>

                            <label for="pesoMascota">Peso</label>
                            <input type="number" id="pesoMascota" name="pesoMascota" required>

                        </div>

                        <div>

                            <label for="ciudadMascota">Ciudad</label>
                            <input type="text" id="ciudadMascota" name="ciudadMascota" required>
                            
                        </div>

                        <div>

                            <label for="especie">Especie</label>
                            <input type="text" id="especie" name="especie" required>

                        </div>

                        <div>

                            <label for="raza">Raza</label>
                            <input type="text" id="raza" name="raza" required>

                        </div>

                        <div>
                            <button type="submit">Guardar Ficha Clínica</button>
                        </div>
                        
                    </form>

                </div>
            
            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE PARA CREAR UNA FICHA DE PACIENTE NUEVA -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
