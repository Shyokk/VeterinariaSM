<!-- EN ESTE HTML CREARFICHA SERÁ PARA LA VISTA DE DOCTOR PARA CREAR FICHAS NUEVAS DE PACIENTE -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">
            
            <!-- ESTE ES EL COMIENZO DEL BLOQUE PARA CREAR UNA FICHA DE PACIENTE NUEVA -->
            <section class="seccion-ficha">
                
                <div>

                    <h1>Crear Nueva Ficha de Paciente</h1>

                    <form class="formulario-ficha">

                        <div>
                            <label for="nombre-paciente">Nombre del Paciente</label>
                            <input type="text" id="nombre-paciente" name="nombre-paciente" required>
                        </div>

                        <div>
                            <label for="especie">Especie o Raza</label>
                            <input type="text" id="especie" name="especie" required>
                        </div>

                        <div>
                            <label for="edad">Edad (años)</label>
                            <input type="number" id="edad" name="edad" min="0" required>
                        </div>

                        <div>
                            <label for="nombre-tutor">Nombre del Tutor</label>
                            <input type="text" id="nombre-tutor" name="nombre-tutor" required>
                        </div>

                        <div>
                            <button type="submit">Guardar Ficha Clínica</button>
                        </div>
                        
                    </form>

                </div>
            
            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE PARA CREAR UNA FICHA DE PACIENTE NUEVA -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
