<!-- EN ESTE HTML NUEVAVACUNA SERA PARA LA VISTA DE DOCTOR, PARA REGISTRAR LAS VACUNAS DEL PACIENTE -->

<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nueva Vacuna - Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

```
<!-- ESTE ES EL COMIENZO DEL BODY -->
<body>
    
    <!-- ESTE ES EL COMIENZO DEL HEADER -->
    <div id="header-contenedor"></div>
    <!-- ESTE ES EL FINAL DEL HEADER -->

    <!-- ESTE ES EL COMIENZO DEL MAIN -->
    <main class="contenido-main">

        <section class="seccion-nueva-vacuna">

            <div class="formulario-vacuna">

                <h1>Registrar Vacuna</h1>

                <p>
                    Complete la información correspondiente a la vacunación
                    del paciente.
                </p>

                <form action="#" method="post">

                    <!-- DATOS DEL PACIENTE -->
                    <fieldset>

                        <legend>Datos del paciente</legend>

                        <div class="campo-formulario">
                            <label for="paciente">Paciente:</label>

                            <select id="paciente" name="paciente" required>
                                <option value="">Seleccione una mascota</option>
                                <option value="thor">Thor</option>
                                <option value="kira">Kira</option>
                            </select>
                        </div>

                    </fieldset>

                    <!-- INFORMACIÓN DE LA VACUNA -->
                    <fieldset>

                        <legend>Información de la vacuna</legend>

                        <div class="campo-formulario">
                            <label for="vacuna">Vacuna:</label>

                            <input
                                type="text"
                                id="vacuna"
                                name="vacuna"
                                placeholder="Ingrese el nombre de la vacuna"
                                required
                            >
                        </div>

                        <div class="campo-formulario">
                            <label for="fecha-aplicacion">Fecha de aplicación:</label>

                            <input
                                type="date"
                                id="fecha-aplicacion"
                                name="fecha-aplicacion"
                                required
                            >
                        </div>

                        <div class="campo-formulario">
                            <label for="proxima-dosis">Próxima dosis:</label>

                            <input
                                type="date"
                                id="proxima-dosis"
                                name="proxima-dosis"
                            >
                        </div>

                    </fieldset>

                    <!-- DATOS DEL PROFESIONAL -->
                    <fieldset>

                        <legend>Datos del profesional</legend>

                        <div class="campo-formulario">
                            <label for="veterinario">Veterinario responsable:</label>

                            <input
                                type="text"
                                id="veterinario"
                                name="veterinario"
                                placeholder="Ingrese el nombre del veterinario"
                                required
                            >
                        </div>

                    </fieldset>

                    <!-- OBSERVACIONES -->
                    <fieldset>

                        <legend>Observaciones</legend>

                        <div class="campo-formulario">
                            <label for="observaciones">Observaciones:</label>

                            <textarea
                                id="observaciones"
                                name="observaciones"
                                rows="5"
                                placeholder="Ingrese observaciones sobre la vacunación"
                            ></textarea>
                        </div>

                    </fieldset>

                    <!-- BOTONES -->
                    <div class="acciones-formulario">

                        <button type="submit">
                            Registrar vacuna
                        </button>

                        <button type="reset">
                            Limpiar formulario
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>
    <!-- ESTE ES EL FINAL DEL MAIN -->

    <!-- ESTE ES EL COMIENZO DEL FOOTER -->
    <div id="footer-contenedor"></div>
    <!-- ESTE ES EL FINAL DEL FOOTER -->

    <!-- BLOQUE PARA EL JAVASCRIPT -->
    <script src="assets/js/app.js"></script>
    <!-- BLOQUE PARA EL JAVASCRIPT -->

</body>
<!-- ESTE ES EL FINAL DEL BODY -->
```

</html>
