<!-- EN ESTE HTML AGENDAR SERÁ PARA AGENDAR LA HORA DE LA MASCOTA EN LA VISTA DEL USUARIO -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">

            <!-- ESTE ES EL COMIENZO DEL BLOQUE DE AGENDAR MASCOTAS -->
            <section class="seccion-agendar">

                <div class="tarjeta-agendar">

                    <h1>Agendar hora</h1>

                    <form class="formulario-agendar">

                        <div>

                            <label for="mascota">Nombre de la Mascota:</label>
                            <input type="text" id="mascota" name="mascota" required>

                        </div>

                        <div>

                            <label for="fecha">Fecha:</label>
                            <input type="date" id="fecha" name="fecha" required>

                        </div>

                        <div>

                            <label for="hora"> Hora: </label>
                            <input type="time" id="hora" name="hora" required>

                        </div>

                        <div>

                            <label for="motivo"> Motivo de la consulta: </label>
                            <textarea id="motivo" name="motivo" required> </textarea>

                        </div>

                        <div>

                            <button type="submit">Confirmar Cita </button>

                        </div>
                        
                    </form>

                </div>

            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE DE AGENDAR MASCOTAS -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
