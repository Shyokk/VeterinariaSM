<!-- EN ESTE HTML AGENDAR SERÁ PARA AGENDAR LA HORA DE LA MASCOTA EN LA VISTA DEL USUARIO -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">

            <!-- ESTE ES EL COMIENZO DEL BLOQUE DE AGENDAR MASCOTAS -->
            <section class="seccion-agendar">

                <div class="tarjeta-agendar">

                    <h1>Agendar hora</h1>

                    <form class="formulario-agendar" method="get">

                        <div>

                            <label for="mascota">Nombre de la Mascota:</label>
                            <input type="text" id="mascota" name="mascota" required>

                        </div>

                        <div>

                            <div>

                                <label for="rutMascota">Rut de la mascota:</label>
                                <input type="text" id="rutMascota" maxlength="9" name="rutMascota" placeholder="129634321" disabled>

                            </div>

                            <div>
                                <input type="checkbox" id="aceptaRut" name="aceptaRut">
                                <label>Su mascota cuenta con Rut</label>
                            </div>

                            <div>

                                <label for="codUnico">Código únido para Paciente</label>
                                <input type="text" name="codUnico" id="codUnico" maxlength="9" readonly>

                            </div>

                        </div>

                        <div>

                            <label for="correo">Correo electrónico</label>
                            <input id="correo" name="correo" type="email" autocomplete="email" required>
                            
                        </div>

                        <div>

                            <label for="especie">Especie:</label>
                            <input type="text" id="especie" name="especie" required>

                        </div>

                        <div>

                            <label for="fechaAgendar">Fecha:</label>
                            <input type="date" id="fechaAgendar" name="fechaAgendar" required>

                        </div>

                        <div>

                            <label for="horaCita"> Hora: </label>
                            <input type="time" id="horaCita" name="horaCita" required>

                        </div>

                        <div>

                            <label for="motivo"> Motivo de la consulta: </label>
                            <textarea id="motivo" name="motivo" required> </textarea>

                        </div>

                        <div>

                            <button type="submit">Confirmar Cita </button>

                        </div>
                        
                    </form>

                </div>

            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE DE AGENDAR MASCOTAS -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
