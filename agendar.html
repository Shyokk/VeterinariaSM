<!-- EN ESTE HTML AGENDAR SERÁ PARA AGENDAR LA HORA DE LA MASCOTA EN LA VISTA DEL USUARIO -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">

            <!-- ESTE ES EL COMIENZO DEL BLOQUE DE AGENDAR MASCOTAS -->
            <section class="seccion-agendar">

                <div class="tarjeta-agendar">

                    <h1>Agendar hora</h1>

                    <form class="formulario-agendar" id="formularioHoraAgendada" method="post" novalidate>

                        <div class="campo-formulario">

                            <label for="mascota">Nombre de la Mascota:</label>
                            <input type="text" id="mascota" name="mascota" minlength="2" maxlength="30" required>
                            <small class="error-campo" data-error-for="mascota"></small>

                        </div>

                        <div class="campo-formulario">

                            <label for="codUnico">RUT o Código únido</label>
                            <input type="text" name="codUnico" id="codUnico" maxlength="9" placeholder="Se generará automaticamente">

                            <div class="fila-check">
                                <input type="checkbox" name="pacienteTieneIdentificador" id="aceptaRut" value="true">
                                <label for="aceptaRut">El paciente cuenta con RUT o Código único</label>
                            </div>

                            <small class="ayudaCampo">Si no existe, el sistema generará uno</small>
                            <small class="error-campo" data-error-for="codUnico"></small>

                        </div>

                        <div class="campo-formulario">

                            <label for="correo">Correo</label>
                            <input type="email" name="correo" id="correo" autocomplete="email" maxlength="150" required>
                            <small class="error-campo" data-error-for="correo"></small>

                        </div>

                        <div class="campo-formulario">

                            <label for="telefonoCita">Telefono Tutor</label>
                            <input type="tel" name="telefonoCita" id="telefonoCita" autocomplete="tel" maxlength="20" placeholder="123123121" required>

                        </div>

                        <div class="campo-formulario">

                            <label for="fechaAgendar">Fecha:</label>
                            <input type="date" id="fechaAgendar" name="fechaAgendar" required>
                            <small class="error-campo" data-error-for="fechaAgendar"></small>

                        </div>

                        <div class="campo-formulario">

                            <label for="horaCita"> Hora: </label>
                            <input type="time" id="horaCita" name="horaCita" min="08:30" max="16:30" required>
                            <small class="ayudaCampo">Horario 08:30 a 16:30</small>
                            <small class="error-campo" data-error-for="horaCita"></small>

                        </div>

                        <input type="hidden" name="estadoSolicitud" value="pendiente">
                        <input type="hidden" name="fechaSolicitud">

                        <div>

                            <button type="submit" class="btnSolicitar">Solicitar Cita </button>

                            <button type="button" data-accion="descargar">Descargar JSON</button>

                        </div>

                        <div id="mensajeSolicitud" class="mensaje-formulario" role="alert" aria-label="polite"></div>
                        
                    </form>

                </div>

            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE DE AGENDAR MASCOTAS -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <script type="module" src="assets/js/agendar.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
