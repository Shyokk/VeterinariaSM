<!-- EN ESTE HTML HISTORIAL SERA PARA LOS DOCTORES DONDE PODRÁN VER EL PACIENTE COMO DOCTOR, MODIFICAR DATOS, ETC -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">
            
            <!-- ESTE ES EL COMIENZO DEL BLOQUE PARA VER EL HISTORIAL DE LOS PACIENTES -->
            <section class="seccion-historial">

                <h1>Historial Clínico del Paciente</h1>

                <div class="infoPaciente">

                    <div class="datosTutor">
                        <div>
                            <label for="rut">RUT del tutor</label>
                            <input type="text" id="rut" name="rut" value="12.234.234-k" readonly>
                        </div>

                        <div>
                            <label for="nombreTutor">Nombre del tutor</label>
                            <input type="text" id="nombreTutor" name="nombreTutor" value="José Miguel" readonly>
                        </div>
                    </div>

                    <div>
                        <label for="nombreMascota">Nombre del Päciente</label>
                        <input type="text" id="nombreMascota" name="nombreMascota" value="Fido" readonly>
                    </div>

                    <div>
                        <label for="rutMascota">RUT del Paciente</label>
                        <input type="text" id="rutMascota" name="rutMascota" value="123456789" readonly>
                    </div>

                    <div>
                        <label for="codUnico">Código único del Paciente</label>
                        <input type="text" id="codUnico" name="codUnico" value="No Aplica" readonly>
                    </div>

                    <div>
                        <label for="nacimientoMascota">Fecha de nacimiento</label>
                        <input type="date" id="nacimientoMascota" name="nacimientoMascota" value="2020-05-15" readonly>
                    </div>

                    <div>
                        <label for="edadMascota">Edad</label>
                        <input type="number" id="edadMascota" name="edadMascota" value="6" readonly>
                    </div>

                    <div>
                        <label for="pesoMascota">Peso</label>
                        <input type="number" id="pesoMascota" name="pesoMascota" value="12.5" readonly>
                    </div>

                    <div>
                        <label for="ciudadMascota">Ciudad</label>
                        <input type="text" id="ciudadMascota" name="ciudadMascota" value="Santiago" readonly>
                    </div>

                    <div>
                        <label for="especie">Especie</label>
                        <input type="text" id="especie" name="especie" value="Canino" readonly>
                    </div>

                    <div>
                        <label for="raza">Raza</label>
                        <input type="text" id="raza" name="raza" value="Mestizo" readonly>
                    </div>
                    
                </div>

                <div class="grill-tarjetaConsulta">

                    <h1>Consultas</h1>

                    <section class="tarjeta-consultas">
                        <!-- MI IDEA ES PONER UN SELECTOR DE LAS CONSULTAS
                             CON LAS FECHAS DE LAS CONSULTAS AL SELECCIONARLO SE MUESTRA
                             LA CONSULTA O QUIZAS SE DESCARGARÁ HAY QUE VER -->
                    </section>

                </div>

                <div class="grill-tarjetaExamen">

                    <h1>Examenes</h1>

                    <section class="tarjeta-examenes">
                        <!-- MI IDEA ES PONER UN SELECTOR DE LOS EXAMENES
                             CON EL NOMBRE DEL EXCAMEN Y LA FECHA DE REALIZACION
                             AL SELECCIONARLO SE MUESTRA EL EXAMEN O SE DESCARGA HAY QUE VER -->
                    </section>

                </div>

                <div class="grill-tarjetaVacuna">

                    <h1>Vacunas</h1>

                    <section class="tarjeta-vacunas">
                        <!-- MI IDEA ES PONER UN SELECTOR DE VACUNAS POR DOSIS Y MOSTRAR LA INFORMACIÓN -->
                    </section>

                </div>
                
            </section>
            <!-- ESTE ES EL FINAL DEL BLOQUE PARA VER EL HISTORIAL DE LOS PACIENTES -->

        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
