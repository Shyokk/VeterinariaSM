<!-- EN ESTE HTML LOGIN SERA PARA USUARIOS DONDE SE PODRÁN LOGEAR CON SU CUENTA -->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyecto Veterinaria San Marcos</title>
        <link rel="stylesheet" href="assets/css/estilos.css">
    </head>

    <!-- ESTE ES EL COMIENZO DEL BODY -->
    <body>
        
        <!-- ESTE ES EL COMIENZO DEL HEADER -->
         <div id="header-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL HEADER -->

        <!-- ESTE ES EL COMIENZO DEL MAIN -->
        <main class="contenido-main">

            <section class="seccion-login">

                <div>
                
                    <h1>Iniciar Sesión</h1>
                    
                    <form class="formulario-login">
                        
                        <div>
                            
                            <label for="correo-usuario">Correo Electrónico</label>
                            <input type="email" id="correo-usuario" name="correo-usuario" required>
                            
                        </div>

                        <div>

                            <label for="clave-usuario">Contraseña</label>
                            <input type="password" id="clave-usuario" name="clave-usuario" required>

                        </div>

                        <div>

                            <button type="submit" class="btnInicioSesion">Iniciar Sesión</button>

                        </div>

                    </form>

                    <a href="register.html">No tienes una cuenta?</a>

                </div>
            
            </section>
            
        </main>
        <!-- ESTE ES EL FINAL DEL MAIN -->

        <!-- ESTE ES EL COMIENZO DEL FOOTER -->
         <div id="footer-contenedor"></div>
        <!-- ESTE ES EL FINAL DEL FOOTER -->

        <!-- BLOQUE PARA EL JAVASCRIPT -->
        <script src="assets/js/app.js"></script>
        <!-- BLOQUE PARA EL JAVASCRIPT -->

    </body>
    <!-- ESTE ES EL FINAL DEL BODY -->

</html>
